name: Build Flutter APK

on:
  push:
    branches: [ "master", "main" ] # يعمل عند الرفع على الفرع الرئيسي
  workflow_dispatch: # يتيح لك تشغيل البناء يدويًا من زر Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # يمكنك تحديد الإصدار هنا إذا أردت، مثل: flutter-version: '3.19.x'

      # 4. تحميل المكتبات والاعتمادات
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء ملف APK (Release)
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # 6. رفع ملف APK الناتج إلى Actions Artifacts للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
